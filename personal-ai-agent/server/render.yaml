services:
  - type: web
    name: personal-ai-agent-api
    runtime: docker
    dockerfilePath: ./personal-ai-agent/server/Dockerfile
    dockerContext: ./personal-ai-agent/server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_API_TOKEN
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-tts
      - key: PORT
        value: 8080
      - key: CORS_ORIGIN
        value: "*"
