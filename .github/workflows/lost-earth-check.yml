name: LOST EARTH browser smoke test
on:
  push:
    branches: [feature/lost-earth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y && npm install --save-dev playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8080 >/tmp/lost-earth-server.log 2>&1 &
      - run: node lost-earth/smoke-test.cjs
