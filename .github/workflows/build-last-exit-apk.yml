name: Build Last Exit Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "last-exit/**"
      - ".github/workflows/build-last-exit-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        working-directory: last-exit
        run: npm install
      - name: Build web game
        working-directory: last-exit
        run: npm run build
      - name: Add Android platform
        working-directory: last-exit
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: last-exit
        run: npx cap sync android
      - name: Build debug APK
        working-directory: last-exit/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: last-exit-debug-apk
          path: last-exit/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
