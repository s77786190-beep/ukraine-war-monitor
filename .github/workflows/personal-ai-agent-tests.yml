name: Personal AI Agent — tests

on:
  push:
    branches:
      - feature/personal-ai-agent
    paths:
      - "personal-ai-agent/server/**"
      - "personal-ai-agent/App.tsx"
      - "personal-ai-agent/package.json"
      - "personal-ai-agent/app.json"
      - ".github/workflows/personal-ai-agent-tests.yml"
  pull_request:
    paths:
      - "personal-ai-agent/server/**"
      - "personal-ai-agent/App.tsx"
      - "personal-ai-agent/package.json"
      - "personal-ai-agent/app.json"
      - ".github/workflows/personal-ai-agent-tests.yml"

concurrency:
  group: personal-ai-agent-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-ai-agent/server
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Установить зависимости backend
        run: npm install
      - name: Запустить интеграционные тесты API
        run: npm test

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-ai-agent
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Установить зависимости клиента
        run: npm install
      - name: Проверить совместимость Expo SDK
        run: npx expo install --check
      - name: Проверить TypeScript
        run: npm run typecheck
      - name: Проверить генерацию нативного Android-проекта
        run: npx expo prebuild --platform android --no-install --clean
      - name: Проверить структуру Android-проекта и идентификатор приложения
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          node -e 'const app = require("./app.json"); if (app.expo?.android?.package !== "com.strannik.personalagent") process.exit(1)'
