name: Build Personal AI Agent APK

on:
  workflow_dispatch:
  push:
    paths:
      - "personal-ai-agent/**"
      - ".github/workflows/personal-ai-agent-apk.yml"

# Не тратить минуты CI на устаревшие сборки после каждого быстрого коммита.
concurrency:
  group: personal-ai-agent-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-ai-agent
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Установить Android platform-tools
        run: sdkmanager "platform-tools" "platforms;android-36"
      - name: Установить зависимости
        run: npm install
      - name: Проверить TypeScript
        run: npm run typecheck
      - name: Сгенерировать Android-проект
        run: npx expo prebuild --platform android --no-install
      - name: Собрать APK
        timeout-minutes: 15
        run: |
          chmod +x android/gradlew
          cd android
          # Повторяем сборку при временных ограничениях Maven Central (HTTP 429).
          for attempt in 1 2 3; do
            if timeout 240 ./gradlew assembleDebug --no-daemon --console=plain; then
              exit 0
            fi
            status=$?
            echo "Gradle attempt $attempt failed or timed out (exit $status)."
            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done
          exit 1
      - name: Опубликовать APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-agent-debug-apk
          path: personal-ai-agent/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
