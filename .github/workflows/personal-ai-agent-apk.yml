name: Build Personal AI Agent APK

on:
  workflow_dispatch:
  push:
    paths:
      - "personal-ai-agent/**"
      - ".github/workflows/personal-ai-agent-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-ai-agent
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: personal-ai-agent/package.json
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v3
      - name: Установить зависимости
        run: npm install
      - name: Проверить TypeScript
        run: npm run typecheck
      - name: Сгенерировать Android-проект
        run: npx expo prebuild --platform android --no-install
      - name: Собрать APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Опубликовать APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-agent-debug-apk
          path: personal-ai-agent/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
