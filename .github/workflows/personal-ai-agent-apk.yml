name: Build Personal AI Agent APK

on:
  workflow_dispatch:
  push:
    paths:
      - "personal-ai-agent/**"
      - ".github/workflows/personal-ai-agent-apk.yml"

concurrency:
  group: personal-ai-agent-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-ai-agent
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Установить Android SDK tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Установить зависимости
        run: npm install
      - name: Проверить TypeScript
        run: npm run typecheck
      - name: Сгенерировать Android-проект
        run: npx expo prebuild --platform android --no-install
      - name: Собрать автономный release APK
        timeout-minutes: 15
        shell: bash
        run: |
          set +e
          chmod +x android/gradlew
          cd android
          for attempt in 1 2 3; do
            timeout 240 ./gradlew assembleRelease --no-daemon --console=plain
            status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            echo "Gradle release attempt $attempt failed (exit $status)."
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep 20
          done
          cd ..
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -F 'assets/index.android.bundle'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com.strannik.personalagent'"
      - name: Опубликовать APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-agent-release-apk
          path: personal-ai-agent/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
